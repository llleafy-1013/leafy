          <p><span>瑶族纹样历史源远流长。秦汉时期瑶族便已知用木皮制作服饰。早在汉代，史料对瑶族刺绣已有记载。流传的始祖盘瓠传说中就有记载瑶人刺绣。《后汉书·南蛮传》记载华南先民“织绩木皮，染以草实”“好五色衣”“衣斑斓”。隋唐时期已出现瑶族绣花裙。宋代瑶族刺绣技艺十分纯熟，明末清初已达鼎盛。</span></p>
